# ~/.tmux.conf  (symlinked from dotfiles/config/tmux.conf)

### Terminal & colors ---------------------------------------------------------
# Advertise a 256-color, italics-capable terminal inside tmux.
set -g default-terminal "tmux-256color"
# Enable true (24-bit RGB) color for the outer terminals we actually use, so
# Claude Code / nvim / bat render full color instead of a washed-out 256 ramp.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks"

### Behavior that makes TUIs (Claude Code, nvim) behave ------------------------
# Don't swallow the Esc key — a long delay makes Claude's Esc-to-interrupt and
# vim's mode switches feel laggy. Small but non-zero avoids eating real escapes.
set -sg escape-time 10
# Let apps know when their pane gains/loses focus (autoread, cursor, etc.).
set -g focus-events on
# Pass DCS/OSC escape sequences straight through — needed for Claude Code image
# rendering and other programs that talk to the real terminal.
set -g allow-passthrough on
# Copy to the system clipboard via OSC 52 (alacritty supports it).
set -g set-clipboard on
# Let programs set the terminal window title.
set -g set-titles on
set -g set-titles-string "#T"
# Generous scrollback for long build/agent output.
set -g history-limit 100000

### Usability -----------------------------------------------------------------
set -g mouse on                 # clickable panes/windows, wheel scroll, resize
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gap-free after close
setw -g mode-keys vi            # vi keys in copy mode
set -g display-time 2000        # messages linger 2s
set -g status-interval 5

### Key bindings --------------------------------------------------------------
# Reload config without restarting tmux.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Splits that keep the current working directory (and are easier to remember).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style copy: v to select, y to yank to system clipboard.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

### Status bar ----------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=black,bg=green,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=cyan]#H #[fg=white]%H:%M "
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag,*Z,} "
setw -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=cyan"
set -g pane-border-style "fg=brightblack"
