# mise's global config, linked here from the repo by install.sh.
#
# Adding a tool: `mise use -g <tool>@latest` writes it back into this file
# through the symlink, or just edit it here. `mise registry` lists the names.

[tools]
direnv = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
jq = "latest"
neovim = "latest"
node = "lts"
ripgrep = "latest"
uv = "latest"
zoxide = "latest"
rust = { version = "stable", profile = "default", components = ["rust-analyzer", "rust-src", "llvm-tools"] }
"cargo:cargo-nextest" = "latest"
"github:nalgeon/sqlpkg-cli" = "latest"
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:pyright" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
